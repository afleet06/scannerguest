<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Asistencia - RSVP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librería para generar el código QR visualmente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 text-emerald-400">¡Confirma tu Asistencia! 🎉</h1>
        <p class="text-sm text-slate-400 text-center mb-6">Ingresa tu nombre para generar tu pase digital.</p>
        
        <!-- FORMULARIO -->
        <div id="form-container" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nombre Completo</label>
                <input type="text" id="nombre-invitado" placeholder="Ej. Juan Pérez" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="registrarAsistencia()" id="btn-enviar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition-all">
                Generar mi Pase QR
            </button>
        </div>

        <!-- PASE GENERADO (Oculto al inicio) -->
        <div id="pass-container" class="hidden text-center space-y-4">
            <div class="bg-emerald-950 border border-emerald-600/50 p-4 rounded-xl">
                <p class="text-xs text-emerald-400 font-semibold uppercase">¡Registro Exitoso!</p>
                <h2 id="label-nombre" class="text-xl font-bold text-white mt-1"></h2>
            </div>
            
            <p class="text-xs text-slate-300">Toma una captura de pantalla o guarda este código QR para presentarlo en la entrada del evento.</p>
            
            <!-- Aquí se dibuja el QR automáticamente -->
            <div id="qrcode" class="flex justify-center bg-white p-4 rounded-xl w-48 h-48 mx-auto"></div>
            
            <p id="label-codigo" class="text-xs font-mono text-slate-400"></p>

            <button onclick="reiniciarFormulario()" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-2 px-4 rounded-xl transition-all">
                Registrar otro invitado
            </button>
        </div>
    </div>

    <script>
        // CONFIGURA TUS CREDENCIALES DE SUPABASE AQUÍ (Las mismas que usaste en el escáner)
        const SUPABASE_URL = 'https://mbgkxotrijtbkypuwtdc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1iZ2t4b3RyaWp0Ymt5cHV3dGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Njc1OTYsImV4cCI6MjEwNzI0MzU5Nn0.o0gnJqCNmj8wHSSWGWkHIAXUIryEy0Enxx6QNztAGQc';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function registrarAsistencia() {
            const nombreInput = document.getElementById('nombre-invitado');
            const nombre = nombreInput.value.trim();
            const btnEnviar = document.getElementById('btn-enviar');

            if (!nombre) {
                alert("Por favor, ingresa tu nombre completo.");
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerText = "Generando pase...";

            // 1. Generar un código único e irrepetible (Ej: BODA-8F3A2C)
            const codigoUnico = 'PASS-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            // 2. Guardar en Supabase
            const { error } = await supabaseClient
                .from('invitados')
                .insert([
                    { nombre: nombre, codigo_qr: codigoUnico, asistio: false }
                ]);

            if (error) {
                alert("Hubo un error al registrar. Inténtalo de nuevo.");
                console.error(error);
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Generar mi Pase QR";
                return;
            }

            // 3. Ocultar formulario y mostrar el pase con el QR generado
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('pass-container').classList.remove('hidden');
            
            document.getElementById('label-nombre').innerText = nombre;
            document.getElementById('label-codigo').innerText = `Código: ${codigoUnico}`;

            // 4. Limpiar contenedor anterior y dibujar el nuevo QR
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: codigoUnico,
                width: 160,
                height: 160,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function reiniciarFormulario() {
            document.getElementById('nombre-invitado').value = "";
            document.getElementById('pass-container').classList.add('hidden');
            document.getElementById('form-container').classList.remove('hidden');
            const btnEnviar = document.getElementById('btn-enviar');
            btnEnviar.disabled = false;
            btnEnviar.innerText = "Generar mi Pase QR";
        }
    </script>
</body>
</html>
